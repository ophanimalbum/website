<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ophanim</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Anton', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 0 auto;
    }

    .logo img {
      width: min(80vw, 320px);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .hero-image {
      width: min(85vw, 340px);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      margin: 0 auto;
    }

    .button-link {
      display: inline-block;
      padding: 14px 28px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-size: clamp(1rem, 2vw, 1.2rem);
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    .button-link:hover {
      background: #fff;
      color: #000;
      transform: translateY(-2px);
    }

    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-icon img {
      width: 42px;
      height: 42px;
      transition: transform 0.25s ease;
    }

    .social-icon:hover img {
      transform: scale(1.12);
    }

    @media (max-width: 480px) {
      .container {
        gap: 20px;
      }

      .social-icon img {
        width: 36px;
        height: 36px;
      }

      .button-link {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="logo">
      <img src="logo_white.png" alt="Ophanim Logo" />
    </header>

    <main class="container">
      <img src="consumed.jpg" alt="Consumed Cover Art" class="hero-image" />

      <h1>CONSUMED OUT NOW!!!</h1>

      <div class="social-links">
        <a href="https://soundcloud.com/ophanimalbum" target="_blank" class="social-icon">
          <img src="soundcloud-white-icon.png" alt="SoundCloud" />
        </a>
                <a href="https://open.spotify.com/album/6BgBKwEWQFqhzsmx5gW6J1?si=ixkLHtyxSjWUpfXtrmpwVw" target="_blank" class="social-icon">
          <img src="spotify-white-icon.png" alt="Spotify" />
        </a>
        <a href="https://music.apple.com/gb/album/consumed-single/1890959376" target="_blank" class="social-icon">
          <img src="apple-music.png" alt="Apple Music / iTunes" />
        </a>
        <a href="https://www.instagram.com/ophan1m/" target="_blank" class="social-icon">
          <img src="instagram-white-icon.png" alt="Instagram" />
        </a>
        <a href="https://www.youtube.com/watch?v=N8mq8Qv7YjU" target="_blank" class="social-icon">
          <img src="youtube-app-white-icon.png" alt="YouTube" />
        </a>
      </div>
    </main>
  </div>
</body>
</html>
