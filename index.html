<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ophanim</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="logo">
            <img src="logo_white.png" alt="Ophanim Logo">
        </header>

        <main>
            <div class="image-container">
                <img src="albumcover.png" alt="Album Cover" class="square-image">
            </div>

            <div class="social-links">
                <a href="https://soundcloud.com/ophanimalbum" target="_blank" class="social-icon">
                    <img src="soundcloud-white-icon.png" alt="SoundCloud">
                </a>
                <a href="https://www.instagram.com/ophan1m/" target="_blank" class="social-icon">
                    <img src="instagram-white-icon.png" alt="Instagram">
                </a>
                <a href="https://www.youtube.com/@ophanimalbum" target="_blank" class="social-icon">
                    <img src="youtube-app-white-icon.png" alt="YouTube">
                </a>
            </div>
        </main>
    </div>
</body>
</html>
